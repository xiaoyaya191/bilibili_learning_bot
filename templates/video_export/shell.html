<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>@@TITLE@@</title><style>@@CSS@@</style></head>
<body data-export-style="@@STYLE_VERSION@@" data-motion="@@MOTION@@" class="@@BODY_CLASS@@">
<div class="progress-bar" role="progressbar" aria-label="阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>
<header class="export-header"><div class="export-brand" aria-hidden="true"><span class="brand-icon"><i data-lucide="layers"></i></span><div class="brand-copy"><strong>LEARNING / STUDIO</strong><span>@@TITLE@@</span></div></div><div class="header-actions"><button class="tool-button" id="contentsButton" aria-label="章节目录" aria-controls="chapterDrawer" aria-expanded="false" title="章节目录"><i data-lucide="menu"></i><span class="tool-label">目录</span></button><button class="theme-toggle tool-button" id="themeToggle" aria-label="切换主题" title="切换亮暗模式"><i data-lucide="moon"></i></button></div></header>
<main class="slide-container" id="slideContainer">@@SLIDES@@</main>
<nav class="nav slide-nav open" aria-label="演示控制"><button id="prevButton" class="prev" aria-label="上一页" title="上一页"><i data-lucide="chevron-left"></i></button><span class="page-indicator"><span id="currentPage">1</span><span aria-hidden="true">&nbsp; / &nbsp;</span><span id="totalPages">1</span></span><button id="nextButton" class="next" aria-label="下一页" title="下一页"><i data-lucide="chevron-right"></i></button><span class="nav-separator"></span><button id="readingButton" aria-label="切换连续阅读" aria-pressed="false" title="连续阅读"><i data-lucide="book-open"></i></button><button id="playButton" aria-label="自动播放" aria-pressed="false" title="自动播放 · 每 12 秒翻页"><i data-lucide="play" id="playIcon"></i><span class="auto-ring" aria-hidden="true"></span></button><button id="fullscreenButton" aria-label="全屏演示" title="全屏演示"><i data-lucide="maximize"></i></button></nav>
<div class="keyboard-hint"><kbd>←</kbd> <kbd>→</kbd><span> 切换章节 · </span><kbd>R</kbd><span> 阅读 · </span><kbd>F</kbd><span> 全屏</span></div>
<div class="drawer-backdrop" id="drawerBackdrop"></div><aside class="chapter-drawer" id="chapterDrawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden><div class="drawer-header"><div><p class="drawer-kicker">YOUR LEARNING PATH</p><h2 id="drawerTitle">章节目录</h2></div><button class="tool-button" id="closeContents" aria-label="关闭目录"><i data-lucide="x"></i></button></div><div class="chapter-list" id="chapterList"></div><p class="drawer-note">按顺序建立理解，也可以直接跳到感兴趣的章节。<br>长章节可在卡片内滚动，或切换到连续阅读。</p><div class="drawer-tools"><button class="tool-button" id="downloadButton" title="下载 HTML" aria-label="下载 HTML"><i data-lucide="download"></i></button><button class="tool-button" id="printButton" title="打印 / 保存 PDF" aria-label="打印 / 保存 PDF"><i data-lucide="printer"></i></button><span>离线保存 / 打印</span></div></aside><div class="export-toast" id="exportToast" role="status"></div>
<script>@@ICONS@@</script><script>@@JS@@</script>
</body></html>
