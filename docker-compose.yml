services:
  bilibili-bot:
    # 发布到 Docker Hub 后，把 DOCKER_IMAGE 改成你的镜像名即可，例如 yourname/bilibili_learning_bot:latest
    image: ${DOCKER_IMAGE:-bilibili_learning_bot:3.0.2}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-3.0.2}
    container_name: ${CONTAINER_NAME:-bilibili_learning_bot}
    restart: unless-stopped
    ports:
      # 与 Web 管理面板保持一致：容器内外默认都是 7860
      - "${WEB_PORT:-7860}:7860"
    volumes:
      - bili_data:/app/Data
      - bili_knowledge:/app/KnowledgeBase
      - bili_highlights:/app/highlights
      - bili_exports:/app/html_exports
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 7860
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
      BOT_MODE: ${BOT_MODE:-web}
      APP_VERSION: ${APP_VERSION:-3.0.2}
      # 默认空值表示不主动联网；发布者可填 GitHub raw VERSION 或自托管 version.txt。
      UPDATE_CHECK_URL: ${UPDATE_CHECK_URL:-}
      UPDATE_CHECK_TTL: ${UPDATE_CHECK_TTL:-3600}
      TZ: Asia/Shanghai
      BILI_DISCLAIMER_SKIP: ${BILI_DISCLAIMER_SKIP:-1}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/api/version', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  bili_data:
  bili_knowledge:
  bili_highlights:
  bili_exports:
