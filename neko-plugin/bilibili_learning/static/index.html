<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站AI学习机器人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        header h1 { font-size: 24px; margin-bottom: 8px; }
        header p { opacity: 0.9; }
        .status-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .status-item:last-child { border-bottom: none; }
        .btn {
            display: inline-block不是问题，问题是，我需要的是，我需要的是，我需要的是，我需要的是，这个，我需要的是，这个，我需要的是，这个，我需要的是，这个。
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 B站AI学习机器人</h1>
            <p>让AI接管你的B站账号，自动学习成长</p>
        </header>
        <div class="status-card">
            <h3>运行状态</h3>
            <div class="status-item">
                <span>学习状态</span>
                <span id="learning-status">已停止</span>
            </div>
            <div class="status-item">
                <span>已学习视频</span>
                <span id="learned-count">0</span>
            </div>
            <div class="status-item">
                <span>知识库条目</span>
                <span id="knowledge-count">0</span>
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-primary" onclick="startLearning()">🚀 启动学习</button>
            <button class="btn btn-danger" onclick="stopLearning()">⏹️ 停止学习</button>
            <button class="btn btn-secondary" onclick="analyzeVideo()">📹 分析视频</button>
        </div>
    </div>
    <script>
        function startLearning() {
            alert('启动学习功能需要通过 Neko API 调用');
        }
        function stopLearning() {
            alert('停止学习功能需要通过 Neko API 调用');
        }
        function analyzeVideo() {
            alert('视频分析功能需要通过 Neko API 调用');
        }
    </script>
</body>
</html>
