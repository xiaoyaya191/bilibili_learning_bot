name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk ffmpeg libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev \
            libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libsqlite3-dev \
            libncurses5 libstdc++6 aidl
          pip install --upgrade pip
          pip install buildozer cython

      # 提前为 Buildozer 预先预置同意所有 Android SDK Licenses 许可文件
      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n893337d74555b037048113700868669ee755c3d4\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63718c3e1a6c05d44474867a7dc6968d" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      # 使用 --accept-sdk-license 选项直接运行 Buildozer
      - name: Build with Buildozer
        run: |
          buildozer --accept-sdk-license -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-bot-apk
          path: bin/*.apk
