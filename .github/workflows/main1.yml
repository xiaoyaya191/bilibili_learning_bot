name: Release
on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Buildozer and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            ccache \
            wget
          
          python -m pip install --upgrade pip
          pip install buildozer cython
      
      - name: Download and setup Android SDK
        run: |
          # 创建 Android SDK 目录
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cd ~/.buildozer/android/platform/android-sdk
          
          # 下载 command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools tools
          
          # 设置环境变量
          export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_HOME/tools/bin
          
          # 接受所有许可证（自动）
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # 安装 Build-Tools 37
          yes | sdkmanager "build-tools;37.0.0" > /dev/null 2>&1 || true
          
          # 安装其他必要的组件
          yes | sdkmanager "platforms;android-33" > /dev/null 2>&1 || true
          yes | sdkmanager "platform-tools" > /dev/null 2>&1 || true
          
          echo "Android SDK setup completed"
      
      - name: Accept all Android licenses (backup method)
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_HOME/tools/bin
          
          # 再次确认许可证已接受
          yes | sdkmanager --licenses
      
      - name: Set environment variables
        run: |
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/.buildozer/android/platform/android-sdk/tools/bin" >> $GITHUB_ENV
      
      - name: Build APK
        run: |
          export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_HOME/tools/bin
          
          # 如果 buildozer.spec 不存在，创建它
          if [ ! -f buildozer.spec ]; then
            echo "Creating buildozer.spec"
            buildozer init
          fi
          
          # 构建 APK
          buildozer android debug deploy
      
      - name: Find and rename APK
        run: |
          # 查找 APK
          APK_PATH=$(find . -name "*.apk" -o -path "*bin/*.apk" | grep -v "debug" | head -1)
          if [ -z "$APK_PATH" ]; then
            # 在 buildozer 的默认输出目录查找
            APK_PATH=$(find ~/.buildozer -name "*.apk" | head -1)
          fi
          
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "LittleGooseOffice_${{ github.ref_name }}.apk"
            echo "APK found and renamed: LittleGooseOffice_${{ github.ref_name }}.apk"
            ls -la *.apk
          else
            echo "No APK found. Checking directories..."
            find . -name "*.apk"
            find ~/.buildozer -name "*.apk" 2>/dev/null || true
            exit 1
          fi
      
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.apk"
          token: ${{ github.token }}
          generateReleaseNotes: true
