name: Release
on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK with Buildozer Action
        uses: yaminichauhan/buildozer-action@v1
        with:
          command: echo 'yes' | buildozer android debug deploy
      
      - name: Find and rename APK
        run: |
          APK_PATH=$(find . -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "LittleGooseOffice_${{ github.ref_name }}.apk"
            echo "APK found and renamed"
          else
            echo "APK not found"
            exit 1
          fi
      
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.apk"
          token: ${{ github.token }}
          generateReleaseNotes: true
