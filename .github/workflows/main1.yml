name: Release
on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Buildozer and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            ccache \
            wget
          
          python -m pip install --upgrade pip
          pip install buildozer cython
      
      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME
          cd $ANDROID_HOME
          
          # 下载 command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          
          # 直接使用 cmdline-tools 目录，不移动
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/bin
          
          # 接受许可证
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME || true
          
          # 安装 Build Tools
          yes | sdkmanager "build-tools;37.0.0" --sdk_root=$ANDROID_HOME || true
          yes | sdkmanager "platforms;android-33" --sdk_root=$ANDROID_HOME || true
          yes | sdkmanager "platform-tools" --sdk_root=$ANDROID_HOME || true
          
          echo "Android SDK setup completed"
      
      - name: Set environment variables
        run: |
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/bin" >> $GITHUB_ENV
      
      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/bin
          
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          
          buildozer android debug deploy
      
      - name: Find and rename APK
        run: |
          APK_PATH=$(find . -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find ~/.buildozer -name "*.apk" 2>/dev/null | head -1)
          fi
          
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "LittleGooseOffice_${{ github.ref_name }}.apk"
            echo "APK found and renamed"
            ls -la *.apk
          else
            echo "No APK found"
            exit 1
          fi
      
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.apk"
          token: ${{ github.token }}
          generateReleaseNotes: true
