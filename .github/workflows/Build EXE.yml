name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install bilibili-api-python==17.4.1
          pip install openai==2.33.0
          pip install httpx==0.28.1
          pip install colorama==0.4.6
          pip install qrcode==8.2
          pip install qrcode-terminal==0.8
          pip install Pillow==12.1.0
          pip install Flask==3.1.2
          pip install flask-cors==6.0.2
          pip install requests==2.32.5

      - name: Create Data directory for build
        run: |
          mkdir Data

      - name: Build with PyInstaller
        run: |
          pyinstaller --onedir --name bilibili_bot --collect-all bilibili_api --add-data "Data;Data" --hidden-import qrcode_terminal web_panel.py

      - name: Create release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package
          Copy-Item "dist/bilibili_bot/*" -Destination "dist/package/" -Recurse
          # 创建 Data 目录结构（用于运行时）
          New-Item -ItemType Directory -Force -Path "dist/package/Data"
          # 如果存在 config.example.json，复制进去作为模板
          if (Test-Path "config.example.json") {
            Copy-Item "config.example.json" -Destination "dist/package/Data/config.example.json"
          }
          Compress-Archive -Path "dist/package/*" -DestinationPath "bilibili_bot.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilibili_bot
          path: bilibili_bot.zip
